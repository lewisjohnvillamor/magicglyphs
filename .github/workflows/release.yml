# Creates a GitHub release when a version tag (v1.2.3) is pushed, with that version's notes from CHANGELOG.md.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0=="## "v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install:** \`npm install magic-glyphs\` · \`deno add jsr:@magicglyphs/magic-glyphs\` · \`cargo add magic-glyphs\` · \`dotnet add package MagicGlyphs.Avalonia\`"
            echo
            echo "Docs and the full library: https://magicglyphs.com"
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Magic Glyphs $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
