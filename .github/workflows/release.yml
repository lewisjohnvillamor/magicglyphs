# Creates a GitHub release with that version's notes from CHANGELOG.md.
# Run it from the Actions tab (Release → Run workflow, type the version, e.g. 0.8.9), or push a tag like v0.8.9.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in CHANGELOG.md (e.g. 0.8.9)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          echo "V=$v" >> "$GITHUB_ENV"
          awk -v v="$v" '$0=="## "v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No '## $v' section in CHANGELOG.md"; exit 1; fi
          {
            echo
            echo "**Install:** \`npm install magic-glyphs\` · \`deno add jsr:@magicglyphs/magic-glyphs\` · \`cargo add magic-glyphs\` · \`dotnet add package MagicGlyphs.Avalonia\`"
            echo
            echo "Docs and the full library: https://magicglyphs.com"
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$V" --title "Magic Glyphs $V" --notes-file notes.md --target "$GITHUB_SHA"
