[package]
name = "magic-glyphs"
version = "0.8.8"
edition = "2021"
rust-version = "1.70"
description = "Animated icons with sound for Rust apps: the 120 free Magic Glyphs icons, their spring motion and an SVG for any moment of it. No dependencies."
license = "MIT"
homepage = "https://magicglyphs.com"
documentation = "https://magicglyphs.com/docs/rust/"
repository = "https://github.com/lewisjohnvillamor/magicglyphs"
readme = "README.md"
keywords = ["icons", "animation", "svg", "gui", "egui"]
categories = ["gui", "multimedia::images", "rendering"]
include = ["src/**", "examples/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["free-icons"]
# the 120 free icons (about 1 MB of source); turn off to use only icons you generate with the CLI
free-icons = []

[dependencies]
