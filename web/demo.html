<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Glyphs — plain HTML demo</title>
<style>body{font:16px system-ui;margin:2rem;color:#131a26}magic-glyph{margin:.5rem;color:#2747f5;--mg-secondary:#f5b83d;--mg-secondary-opacity:.35}</style>
<h1>Magic Glyphs in plain HTML</h1><p>Hover or tap an icon.</p>
<magic-glyph name="heart" size="48" label="Like"></magic-glyph>
<magic-glyph name="bell" variant="duotone" size="48"></magic-glyph>
<magic-glyph name="rocket" variant="solid" size="48" trigger="click"></magic-glyph>
<magic-glyph name="coin" variant="glass" size="48" trigger="load"></magic-glyph>
<script src="magic-glyphs.all.js"></script>
</html>
