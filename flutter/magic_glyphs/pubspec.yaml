name: magic_glyphs
description: Animated icons with sound for Flutter. 120 free icons with spring motion in outline, solid and duotone, each with its own short sound.
version: 0.8.8
homepage: https://magicglyphs.com
repository: https://github.com/lewisjohnvillamor/magicglyphs
documentation: https://magicglyphs.com/docs/flutter/
topics: [icons, animation, lottie, sound, ui]

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/lottie/
    - assets/sounds/
